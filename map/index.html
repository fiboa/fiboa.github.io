<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harmonized Field Data</title>
  </head>
  <body>
    <h1>
      Harmonized Field Data
      <small><span id="count">0</span> field boundaries</small>
    </h1>
    <div id="map"></div>
    <div id="hint">Zoom in to show the field boundaries</div>
    <div id="toggles">
      <button id="crop-toggle" type="button" aria-pressed="false">With crops</button>
      <button id="cells-toggle" type="button" aria-pressed="false" title="Zoomed out: the share of the land in fields per cell, or a box per dataset">Field density</button>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
